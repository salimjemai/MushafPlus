name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK + App Bundle
    runs-on: ubuntu-latest
    needs: test
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release signing (when the keystore secrets are set)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - run: flutter build apk --release --flavor phone
      - run: flutter build appbundle --release --flavor phone
      - run: flutter build apk --release --flavor wear
      - run: flutter build appbundle --release --flavor wear
      - name: Native libraries per flavor (the watch build ships without the voice model engine)
        run: |
          phone_apk=build/app/outputs/flutter-apk/app-phone-release.apk
          wear_apk=build/app/outputs/flutter-apk/app-wear-release.apk
          phone_aab=build/app/outputs/bundle/phoneRelease/app-phone-release.aab
          wear_aab=build/app/outputs/bundle/wearRelease/app-wear-release.aab
          libs='lib(sherpa-onnx|onnxruntime)'
          {
            echo "## Android build sizes"
            echo
            echo "| File | Bytes |"
            echo "|---|---|"
            for f in "$phone_apk" "$wear_apk" "$phone_aab" "$wear_aab"; do
              echo "| $(basename "$f") | $(stat -c %s "$f") |"
            done
            echo
            echo "sherpa-onnx libraries in the phone APK (uncompressed bytes):"
            echo
            echo '```'
            unzip -l "$phone_apk" | grep -E "$libs"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if ! unzip -l "$phone_apk" | grep -qE "$libs"; then
            echo "::error::the phone APK has no sherpa-onnx libraries"; exit 1
          fi
          for f in "$wear_apk" "$wear_aab"; do
            if unzip -l "$f" | grep -E "$libs"; then
              echo "::error::$f still contains sherpa-onnx libraries"; exit 1
            fi
            echo "$(basename "$f"): no sherpa-onnx libraries" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-plus-android
          path: |
            build/app/outputs/flutter-apk/app-phone-release.apk
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-plus-wear-os
          path: |
            build/app/outputs/flutter-apk/app-wear-release.apk
            build/app/outputs/bundle/wearRelease/app-wear-release.aab

  ios:
    name: iOS (unsigned build check)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-plus-windows
          path: build/windows/x64/runner/Release
