name: mushaf_plus
description: "Mushaf+ : a beautiful cross-platform Quran reader with word-by-word transliteration and 100+ translations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  hive_ce_flutter: ^2.2.0
  http: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  share_plus: ^10.1.0
  audioplayers: ^6.1.0
  timezone: ^0.10.0
  geolocator: ^13.0.1
  intl: ^0.20.0
  pdf: ^3.11.0
  printing: ^5.13.0
  web: ^1.1.0
  speech_to_text: ^7.0.0
  flutter_compass: ^0.8.1
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^7.3.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0F6E56"
    theme_color: "#0F6E56"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter_native_splash:
  color: "#0F6E56"
  color_dark: "#0E1412"
  image: assets/icon/splash.png
  android_12:
    color: "#0F6E56"
    color_dark: "#0E1412"
    image: assets/icon/splash.png
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/data/translations/
    - assets/sounds/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # DigitalKhatt Madina (SIL OFL 1.1): the script of the Madani Mushaf,
    # used for the line-by-line Mushaf pages.
    - family: DigitalKhatt
      fonts:
        - asset: assets/fonts/DigitalKhatt-Madina.otf
